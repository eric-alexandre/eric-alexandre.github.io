<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background gradient: primary palette -->
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#0A0A0F"/>
      <stop offset="40%"  stop-color="#042B38"/>
      <stop offset="100%" stop-color="#0A0A0F"/>
    </linearGradient>

    <!-- Grain texture -->
    <filter id="grain" x="0" y="0" width="100%" height="100%" color-interpolation-filters="linearRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="4" stitchTiles="stitch" result="noise"/>
      <feColorMatrix type="saturate" values="0" in="noise" result="grayNoise"/>
      <feBlend in="SourceGraphic" in2="grayNoise" mode="overlay" result="blended"/>
      <feComposite in="blended" in2="SourceGraphic" operator="in"/>
    </filter>

    <!-- Cyan center glow -->
    <radialGradient id="glow" cx="50%" cy="50%" r="45%">
      <stop offset="0%"   stop-color="#06B6D4" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>

    <clipPath id="round">
      <rect width="512" height="512" rx="96"/>
    </clipPath>
  </defs>

  <!-- Base -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>

  <!-- Grain overlay -->
  <rect width="512" height="512" clip-path="url(#round)" fill="url(#bg)" filter="url(#grain)" opacity="0.18"/>

  <!-- Glow -->
  <rect width="512" height="512" rx="96" fill="url(#glow)"/>

  <!-- Border zinc-800 -->
  <rect x="1.5" y="1.5" width="509" height="509" rx="94.5" fill="none" stroke="#27272A" stroke-width="3"/>

  <!-- x-n wordmark -->
  <text
    x="256"
    y="308"
    font-family="'Geist', 'Inter', system-ui, sans-serif"
    font-size="168"
    font-weight="700"
    fill="#FEFEFE"
    text-anchor="middle"
    letter-spacing="-6"
  >x-n</text>
</svg>
